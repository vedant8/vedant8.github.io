title: Dr. Vedant Basu
email: vbasu@icecube.wisc.edu
description: "Professional website of Dr. Vedant Basu, neutrino astrophysicist."
baseurl: ""
url: "https://vedant8.github.io"
github_username: vedant8
locale: "en-US"

# Theme & Build Settings
theme: jekyll-theme-cayman
markdown: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Default Layout for All Pages
defaults:
  - scope:
      path: ""
    values:
      layout: "custom-default"

# Exclude build/dev artifacts
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/